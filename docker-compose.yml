services:
  imager:
    build:
      context: .
      dockerfile: Dockerfile.imager
    ports:
      - "9000:9000"
    env_file: .env
    volumes:
      - .env:/app/.env:ro
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "9090:8080"
    env_file: .env
    volumes:
      - .env:/app/.env:ro
    restart: unless-stopped

  panel:
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        VITE_API_URL: "http://localhost:9090"
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped


