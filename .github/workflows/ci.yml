name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: linuxer41
  VITE_API_URL: https://imagekit-api.iathings.com
  PUSH: ${{ github.event_name != 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ env.PUSH }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/imagekit-api:latest,${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/imagekit-api:${{ github.sha }}
          platforms: linux/amd64

  imager:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.imager
          push: ${{ env.PUSH }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/imagekit-imager:latest,${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/imagekit-imager:${{ github.sha }}
          platforms: linux/amd64

  panel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.caddy
          push: ${{ env.PUSH }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/imagekit-panel:latest,${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/imagekit-panel:${{ github.sha }}
          build-args: VITE_API_URL=${{ env.VITE_API_URL }}
          platforms: linux/amd64
